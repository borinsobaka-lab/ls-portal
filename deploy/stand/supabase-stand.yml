# Облегчённый Supabase тестового стенда «Аналитики» (DEPLOY.md, шаг 18).
#
# Coolify → проект «Стенд аналитики» → + New → Docker Compose Empty → вставить
# этот файл целиком. Только то, что нужно порталу: база, вход (GoTrue), API
# (PostgREST), файлы (Storage) и Kong перед ними. Нет Studio, Realtime,
# логов, функций, пулера и imgproxy — на рабочем сервере 8 ГБ, и стенд
# не должен отнимать память у рабочего портала: у каждого контейнера —
# предел памяти (mem_limit), всего ~1,3 ГБ.
#
# Ключи генерирует Coolify (SERVICE_PASSWORD_*, SERVICE_SUPABASE*_KEY — как
# у рабочего Supabase), они свои у стенда: токены стенда рабочий портал не
# принимает. Заполнить вручную (Environment Variables сервиса):
#   PORTAL_URL              — https://analytics.ladyfitpro.ru
#   SEND_EMAIL_HOOK_SECRET  — v1,whsec_… (тот же — у портала стенда)
# Версии образов — как в шаблоне Supabase у Coolify (2026-11).
services:
  stand-db:
    image: supabase/postgres:15.8.1.085
    mem_limit: 768m
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      # Небольшая база стенда: меньше общей памяти, чем у рабочей.
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
    environment:
      - POSTGRES_HOST=/var/run/postgresql
      - PGPORT=5432
      - POSTGRES_PORT=5432
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=postgres
      - POSTGRES_DB=postgres
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - JWT_EXP=3600
    volumes:
      - stand-db-data:/var/lib/postgresql/data
      - stand-db-config:/etc/postgresql-custom
      - type: bind
        source: ./volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        content: |
          \set pgpass `echo "$POSTGRES_PASSWORD"`

          ALTER USER authenticator WITH PASSWORD :'pgpass';
          ALTER USER pgbouncer WITH PASSWORD :'pgpass';
          ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
          ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';
      - type: bind
        source: ./volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        content: |
          \set jwt_secret `echo "$JWT_SECRET"`
          \set jwt_exp `echo "$JWT_EXP"`

          ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
          ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';

  stand-auth:
    image: supabase/gotrue:v2.186.0
    mem_limit: 128m
    depends_on:
      stand-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=${SERVICE_URL_STANDKONG}
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@stand-db:5432/postgres
      - GOTRUE_SITE_URL=${PORTAL_URL}
      - GOTRUE_URI_ALLOW_LIST=${PORTAL_URL}/**
      # Людей заводит портал («Пользователи и роли»), вход — по коду из письма.
      - GOTRUE_DISABLE_SIGNUP=true
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=false
      - GOTRUE_EXTERNAL_PHONE_ENABLED=false
      - GOTRUE_MAILER_AUTOCONFIRM=false
      - GOTRUE_MAILER_OTP_LENGTH=6
      - GOTRUE_MAILER_OTP_EXP=3600
      - GOTRUE_RATE_LIMIT_EMAIL_SENT=60
      # Письма с кодом шлёт портал стенда (/api/auth-email) — как у рабочего.
      - GOTRUE_HOOK_SEND_EMAIL_ENABLED=true
      - GOTRUE_HOOK_SEND_EMAIL_URI=${PORTAL_URL}/api/auth-email
      - GOTRUE_HOOK_SEND_EMAIL_SECRETS=${SEND_EMAIL_HOOK_SECRET}

  stand-rest:
    image: postgrest/postgrest:v14.6
    mem_limit: 192m
    depends_on:
      stand-db:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@stand-db:5432/postgres
      - PGRST_DB_SCHEMAS=public,storage,graphql_public
      - PGRST_DB_MAX_ROWS=1000
      - PGRST_DB_EXTRA_SEARCH_PATH=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_DB_POOL=10
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_DB_USE_LEGACY_GUCS=false
      - PGRST_APP_SETTINGS_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_APP_SETTINGS_JWT_EXP=3600
    command: "postgrest"
    exclude_from_hc: true

  stand-storage:
    image: supabase/storage-api:v1.44.2
    mem_limit: 256m
    depends_on:
      stand-db:
        condition: service_healthy
      stand-rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - SERVER_PORT=5000
      - SERVER_REGION=local
      - MULTI_TENANT=false
      - AUTH_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - DATABASE_URL=postgres://supabase_storage_admin:${SERVICE_PASSWORD_POSTGRES}@stand-db:5432/postgres
      - DB_INSTALL_ROLES=false
      # Файлы — на диске сервера (рабочий Supabase — так же), без S3 и imgproxy.
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - GLOBAL_S3_BUCKET=stub
      - TENANT_ID=stub
      - REGION=local
      - FILE_SIZE_LIMIT=209715200
      - UPLOAD_FILE_SIZE_LIMIT=209715200
      - UPLOAD_FILE_SIZE_LIMIT_STANDARD=209715200
      - UPLOAD_SIGNED_URL_EXPIRATION_TIME=120
      - TUS_URL_PATH=/upload/resumable
      - TUS_MAX_SIZE=3600000
      - ENABLE_IMAGE_TRANSFORMATION=false
      - DATABASE_SEARCH_PATH=storage
      - NODE_ENV=production
      - REQUEST_ALLOW_X_FORWARDED_PATH=true
      - ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - POSTGREST_URL=http://stand-rest:3000
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - STORAGE_PUBLIC_URL=${SERVICE_URL_STANDKONG}
    volumes:
      - stand-storage-data:/var/lib/storage

  stand-kong:
    image: kong/kong:3.9.1
    mem_limit: 256m
    entrypoint: /home/kong/kong-entrypoint.sh
    depends_on:
      stand-auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      # Адрес API стенда (домен — в настройках этого контейнера в Coolify).
      - SERVICE_URL_STANDKONG_8000
      - KONG_PORT_MAPS=443:8000
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/kong.yml
      - KONG_DNS_ORDER=LAST,A,CNAME
      - KONG_DNS_NOT_FOUND_TTL=1
      - KONG_PLUGINS=request-transformer,cors,key-auth,acl,post-function
      - KONG_NGINX_WORKER_PROCESSES=1
      - KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k
      - KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k
      - KONG_PROXY_ACCESS_LOG=/dev/stdout combined
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
    volumes:
      - type: bind
        source: ./volumes/api/kong-entrypoint.sh
        target: /home/kong/kong-entrypoint.sh
        content: |
          #!/bin/bash
          # Подставляет ключи в kong.yml (как entrypoint шаблона Supabase у Coolify).
          export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
          awk '{
            result = ""
            rest = $0
            while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
              varname = substr(rest, RSTART + 1, RLENGTH - 1)
              if (varname in ENVIRON) {
                result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
              } else {
                result = result substr(rest, 1, RSTART + RLENGTH - 1)
              }
              rest = substr(rest, RSTART + RLENGTH)
            }
            print result rest
          }' /home/kong/temp.yml > "$KONG_DECLARATIVE_CONFIG"
          exec /entrypoint.sh kong docker-start
      - type: bind
        source: ./volumes/api/kong.yml
        target: /home/kong/temp.yml
        content: |
          _format_version: '2.1'
          _transform: true

          consumers:
            - username: anon
              keyauth_credentials:
                - key: $SUPABASE_ANON_KEY
            - username: service_role
              keyauth_credentials:
                - key: $SUPABASE_SERVICE_KEY

          acls:
            - consumer: anon
              group: anon
            - consumer: service_role
              group: admin

          services:
            - name: auth-v1-open
              url: http://stand-auth:9999/verify
              routes:
                - name: auth-v1-open
                  strip_path: true
                  paths:
                    - /auth/v1/verify
              plugins:
                - name: cors
            - name: auth-v1-open-callback
              url: http://stand-auth:9999/callback
              routes:
                - name: auth-v1-open-callback
                  strip_path: true
                  paths:
                    - /auth/v1/callback
              plugins:
                - name: cors
            - name: auth-v1-open-authorize
              url: http://stand-auth:9999/authorize
              routes:
                - name: auth-v1-open-authorize
                  strip_path: true
                  paths:
                    - /auth/v1/authorize
              plugins:
                - name: cors

            - name: auth-v1
              url: http://stand-auth:9999/
              routes:
                - name: auth-v1-all
                  strip_path: true
                  paths:
                    - /auth/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            - name: rest-v1
              url: http://stand-rest:3000/
              routes:
                - name: rest-v1-all
                  strip_path: true
                  paths:
                    - /rest/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            - name: storage-v1
              connect_timeout: 60
              write_timeout: 3600
              read_timeout: 3600
              url: http://stand-storage:5000/
              routes:
                - name: storage-v1-all
                  strip_path: true
                  paths:
                    - /storage/v1/
                  request_buffering: false
                  response_buffering: false
              plugins:
                - name: cors
                - name: post-function
                  config:
                    access:
                      - |
                        local auth = kong.request.get_header("authorization")
                        if auth == nil or auth == "" or auth:find("^%s*$") then
                          kong.service.request.clear_header("authorization")
                        end

volumes:
  stand-db-data:
  stand-db-config:
  stand-storage-data:
